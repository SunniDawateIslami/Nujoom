        flashMsg = {scope:'account', type:'ok', text:'Email preferences saved.'};
        render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  }
  const pwBtn = document.getElementById('pwBtn');
  if(pwBtn){
    pwBtn.addEventListener('click', async ()=>{
      const p1 = document.getElementById('newPw').value;
      const p2 = document.getElementById('newPw2').value;
      if(!p1 || !p2){ flashMsg={scope:'account',type:'err',text:'Please fill in both password fields.'}; return render(); }
      if(p1 !== p2){ flashMsg={scope:'account',type:'err',text:'Passwords do not match.'}; return render(); }
      const { error } = await sb.auth.updateUser({ password: p1 });
      if(error){ flashMsg={scope:'account',type:'err',text:error.message}; return render(); }
      flashMsg={scope:'account',type:'ok',text:'Password updated.'};
      render();
    });
  }

  /* ---- Registers ---- */
  const regClassSelect = document.getElementById('regClassSelect');
  if(regClassSelect) regClassSelect.addEventListener('change', ()=>{ regSelectedClass = regClassSelect.value; render(); });
  const regDateSelect = document.getElementById('regDateSelect');
  if(regDateSelect) regDateSelect.addEventListener('change', ()=>{ regSelectedDate = regDateSelect.value; render(); });
  const saveRegisterBtn = document.getElementById('saveRegisterBtn');
  if(saveRegisterBtn){
    saveRegisterBtn.addEventListener('click', async ()=>{
      try{
        const entries = {};
        document.querySelectorAll('[data-reg-status]').forEach(sel=>{ entries[sel.dataset.regStatus] = sel.value; });
        const notesEl = document.getElementById('regNotes');
        const notes = notesEl ? notesEl.value.trim() : '';
        const cls = DB.classes[regSelectedClass];
        const { error } = await sb.from('registers').upsert(
          { class_id: cls.id, date: regSelectedDate, teacher_id: currentUser.id, entries, notes, updated_at: new Date().toISOString() },
          { onConflict: 'class_id,date' }
        );
        if(error){ showGlobalError(error.message); return; }
        await refreshAll(); render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  }
  const clearRegistersBtn = document.getElementById('clearRegistersBtn');
  if(clearRegistersBtn) clearRegistersBtn.addEventListener('click', ()=>{ pendingClearRegisters = true; render(); });
  const confirmClearRegistersBtn = document.getElementById('confirmClearRegistersBtn');
  if(confirmClearRegistersBtn){
    confirmClearRegistersBtn.addEventListener('click', async ()=>{
      await sb.from('registers').delete().not('id','is',null);
      pendingClearRegisters = false;
      await refreshAll(); render();
    });
  }
  const cancelClearRegistersBtn = document.getElementById('cancelClearRegistersBtn');
  if(cancelClearRegistersBtn) cancelClearRegistersBtn.addEventListener('click', ()=>{ pendingClearRegisters=false; render(); });

  /* ---- Hifz Progress ---- */
  const hifzDateSelect = document.getElementById('hifzDateSelect');
  if(hifzDateSelect) hifzDateSelect.addEventListener('change', ()=>{ hifzSelectedDate = hifzDateSelect.value; render(); });
  app.querySelectorAll('[data-student-overview]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ studentOverviewUsername = btn.dataset.studentOverview; render(); });
  });
  const studentOverviewBackBtn = document.getElementById('studentOverviewBackBtn');
  if(studentOverviewBackBtn) studentOverviewBackBtn.addEventListener('click', ()=>{ studentOverviewUsername = null; render(); });
  app.querySelectorAll('[data-hifz-student-detail]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ hifzDetailStudent = btn.dataset.hifzStudentDetail; render(); });
  });
  const hifzDetailBackBtn = document.getElementById('hifzDetailBackBtn');
  if(hifzDetailBackBtn) hifzDetailBackBtn.addEventListener('click', ()=>{ hifzDetailStudent = null; render(); });
  const saveHifzBtn = document.getElementById('saveHifzBtn');
  if(saveHifzBtn){
    saveHifzBtn.addEventListener('click', async ()=>{
      try{
        const entries = {};
        document.querySelectorAll('[data-hifz-sabaq]').forEach(sel=>{ const u=sel.dataset.hifzSabaq; entries[u]=entries[u]||{}; entries[u].sabaqLines=sel.value; });
        document.querySelectorAll('[data-hifz-sipara]').forEach(sel=>{ const u=sel.dataset.hifzSipara; entries[u]=entries[u]||{}; entries[u].sabaqSiparaAmount=sel.value; });
        document.querySelectorAll('[data-hifz-sabaq-note]').forEach(inp=>{ const u=inp.dataset.hifzSabaqNote; entries[u]=entries[u]||{}; entries[u].sabaqNote=inp.value.trim(); });
        document.querySelectorAll('[data-hifz-sipara-note]').forEach(inp=>{ const u=inp.dataset.hifzSiparaNote; entries[u]=entries[u]||{}; entries[u].sabaqSiparaNote=inp.value.trim(); });
        document.querySelectorAll('[data-hifz-dor-note]').forEach(inp=>{ const u=inp.dataset.hifzDorNote; entries[u]=entries[u]||{}; entries[u].dorNote=inp.value.trim(); });
        document.querySelectorAll('[data-hifz-mistakes-note]').forEach(inp=>{ const u=inp.dataset.hifzMistakesNote; entries[u]=entries[u]||{}; entries[u].mistakesNote=inp.value.trim(); });
        document.querySelectorAll('.dor-entries').forEach(container=>{
          const u = container.id.replace('dorEntries_','');
          entries[u]=entries[u]||{};
          const dorEntries = [];
          container.querySelectorAll('.dor-entry-row').forEach(row=>{
            const juzSel = row.querySelector('[data-dor-juz-select]');
            const amountSel = row.querySelector('[data-dor-amount-select]');
            const juz = juzSel ? juzSel.value : '';
            const amount = amountSel ? amountSel.value : '';
            if(juz || amount) dorEntries.push({ juz, amount });
          });
          entries[u].dorEntries = dorEntries;
        });
        document.querySelectorAll('.mistake-entries').forEach(container=>{
          const u = container.id.replace('mistakeEntries_','');
          entries[u]=entries[u]||{};
          const mistakeEntries = [];
          container.querySelectorAll('.mistake-entry-row').forEach(row=>{
            const typeSel = row.querySelector('[data-mistake-type-select]');
            const countSel = row.querySelector('[data-mistake-count-select]');
            const type = typeSel ? typeSel.value : '';
            if(type) mistakeEntries.push({ type, count: countSel ? countSel.value : '' });
          });
          entries[u].mistakeEntries = mistakeEntries;
        });
        const hifzClass = classList().find(c=>c.protected);
        const { error } = await sb.from('hifz_progress').upsert(
          { class_id: hifzClass.id, date: hifzSelectedDate, teacher_id: currentUser.id, entries, updated_at: new Date().toISOString() },
          { onConflict: 'class_id,date' }
        );
        if(error){ showGlobalError(error.message); return; }
        await refreshAll(); render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  }

  /* ---- Assignments (Headteacher) ---- */
  const htAClassSelect = document.getElementById('htAClass');
  if(htAClassSelect) htAClassSelect.addEventListener('change', ()=>{ assignClassHT = htAClassSelect.value; render(); });
  const htAssignBtn = document.getElementById('htAssignBtn');
  if(htAssignBtn){
    htAssignBtn.addEventListener('click', async ()=>{
      try{
        const cls = DB.classes[document.getElementById('htAClass').value];
        const due = document.getElementById('htADue').value;
        const studentUsername = document.getElementById('htATarget').value || null;
        const title = document.getElementById('htATitle').value.trim();
        const desc = document.getElementById('htADesc').value.trim();
        if(!cls || !due || !title || !desc) return;
        const { error } = await sb.from('assignments').insert({ class_id: cls.id, student_username: studentUsername, teacher_id: currentUser.id, title, description: desc, due_date: due });
        if(error){ showGlobalError(error.message); return; }
        await refreshAll(); render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  }

  /* ---- Assignments (Teacher) ---- */
  const aClassSelect = document.getElementById('aClass');
  if(aClassSelect) aClassSelect.addEventListener('change', ()=>{ assignClassTeacher = aClassSelect.value; render(); });
  const newAssignmentBtn = document.getElementById('newAssignmentBtn');
  if(newAssignmentBtn){
    newAssignmentBtn.addEventListener('click', async ()=>{
      try{
        const cls = DB.classes[document.getElementById('aClass').value];
        const due = document.getElementById('aDue').value;
        const studentUsername = document.getElementById('aTarget').value || null;
        const title = document.getElementById('aTitle').value.trim();
        const desc = document.getElementById('aDesc').value.trim();
        if(!cls || !due || !title || !desc) return;
        const { error } = await sb.from('assignments').insert({ class_id: cls.id, student_username: studentUsername, teacher_id: currentUser.id, title, description: desc, due_date: due });
        if(error){ showGlobalError(error.message); return; }
        await refreshAll(); render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  }

  /* ---- Submissions ---- */
  app.querySelectorAll('[data-submit-work]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        const assignmentId = btn.dataset.submitWork;
        const form = btn.closest('.submitForm');
        const content = form.querySelector('[data-response]').value.trim();
        if(!content) return;
        const { error } = await sb.from('submissions').upsert(
          { assignment_id: assignmentId, student_username: currentUser.username, content, submitted_at: new Date().toISOString(), submitted_by_role: 'student', submitted_by_name: currentUser.name },
          { onConflict: 'assignment_id,student_username' }
        );
        if(error){ showGlobalError(error.message); return; }
        await refreshAll(); render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  });
  app.querySelectorAll('[data-parent-submit-work]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        const assignmentId = btn.dataset.parentSubmitWork;
        const form = btn.closest('.submitForm');
        const content = form.querySelector('[data-parent-response]').value.trim();
        if(!content) return;
        const children = parentChildren();
        const selected = children.find(c=>c.username===parentSelectedChild) || children[0];
        if(!selected) return;
        const existing = submissionFor(assignmentId, selected.username);
        let error;
        if(existing){
          ({ error } = await sb.from('submissions').update(
            { content, submitted_at: new Date().toISOString(), submitted_by_role: 'parent', submitted_by_name: currentUser.name }
          ).eq('id', existing.id));
        } else {
          ({ error } = await sb.from('submissions').insert(
            { assignment_id: assignmentId, student_username: selected.username, content, submitted_at: new Date().toISOString(), submitted_by_role: 'parent', submitted_by_name: currentUser.name }
          ));
        }
        if(error){ showGlobalError(error.message); return; }
        await refreshAll(); render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  });

  /* ---- Behaviour ---- */
  const behClassSelect = document.getElementById('behClassSelect');
  if(behClassSelect) behClassSelect.addEventListener('change', ()=>{ behSelectedClass = behClassSelect.value; render(); });
  const behSaveBtn = document.getElementById('behSaveBtn');
  if(behSaveBtn){
    behSaveBtn.addEventListener('click', async ()=>{
      try{
        const cls = DB.classes[behSelectedClass];
        const date = document.getElementById('behDate').value;
        const studentUsername = document.getElementById('behStudent').value;
        const description = document.getElementById('behDesc').value.trim();
        const informParent = document.getElementById('behInformParent') ? document.getElementById('behInformParent').checked : false;
        if(!cls || !date || !studentUsername || !description) return;
        const { data, error } = await sb.from('behaviours').insert({ student_username: studentUsername, class_id: cls.id, teacher_id: currentUser.id, date, description, inform_parent: informParent }).select().single();
        if(error){ showGlobalError(error.message); return; }
        if(informParent && data){
          await sb.from('parent_notifies').insert({ behaviour_id: data.id, student_username: studentUsername, class_id: cls.id, teacher_id: currentUser.id, message: description, status: 'pending' });
        }
        await refreshAll(); render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  }
  app.querySelectorAll('[data-approve-notify]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        const key = btn.dataset.approveNotify;
        const n = DB.parentNotifies[key];
        if(!n) return;
        const editedEl = document.querySelector(`[data-notify-edit="${key}"]`);
        const finalMessage = editedEl ? editedEl.value.trim() : n.message;
        const { error } = await sb.from('parent_notifies').update({ message: finalMessage, status:'approved', approved_by: currentUser.id, approved_at: new Date().toISOString() }).eq('id', n.id);
        if(error){ showGlobalError(error.message); return; }
        await refreshAll(); render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  });
  app.querySelectorAll('[data-reject-notify]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        const n = DB.parentNotifies[btn.dataset.rejectNotify];
        if(!n) return;
        await sb.from('parent_notifies').update({ status:'rejected', approved_by: currentUser.id, approved_at: new Date().toISOString() }).eq('id', n.id);
        await refreshAll(); render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  });

  /* ---- Messages ---- */
  const htMsgSendBtn = document.getElementById('htMsgSendBtn');
  if(htMsgSendBtn){
    htMsgSendBtn.addEventListener('click', async ()=>{
      try{
        const studentUsername = document.getElementById('htMsgStudentSelect').value;
        const body = document.getElementById('htMsgBody').value.trim();
        if(!studentUsername || !body) return;
        const { error } = await sb.from('messages').insert({ student_username: studentUsername, teacher_id: currentUser.id, from_id: currentUser.id, from_role:'teacher', body });
        if(error){ showGlobalError(error.message); return; }
        notifyParentOfMessage(studentUsername);
        await refreshAll(); render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  }
  app.querySelectorAll('[data-ht-send-reply]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        const studentUsername = btn.dataset.htSendReply;
        const ta = document.querySelector(`[data-ht-thread-reply="${studentUsername}"]`);
        const body = ta ? ta.value.trim() : '';
        if(!body) return;
        const { error } = await sb.from('messages').insert({ student_username: studentUsername, teacher_id: currentUser.id, from_id: currentUser.id, from_role:'teacher', body });
        if(error){ showGlobalError(error.message); return; }
        notifyParentOfMessage(studentUsername);
        await refreshAll(); render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  });
  app.querySelectorAll('[data-send-reply]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        const studentUsername = btn.dataset.sendReply;
        const ta = document.querySelector(`[data-thread-reply="${studentUsername}"]`);
        const body = ta ? ta.value.trim() : '';
        if(!body) return;
        const { error } = await sb.from('messages').insert({ student_username: studentUsername, teacher_id: currentUser.id, from_id: currentUser.id, from_role:'teacher', body });
        if(error){ showGlobalError(error.message); return; }
        notifyParentOfMessage(studentUsername);
        notifyHeadteacherOfTeacherMessage(studentUsername, currentUser.name);
        await refreshAll(); render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  });
  const parentChildSelect = document.getElementById('parentChildSelect');
  if(parentChildSelect) parentChildSelect.addEventListener('change', ()=>{ parentSelectedChild = parentChildSelect.value; render(); });
  app.querySelectorAll('[data-parent-send-reply]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        const teacherKey = btn.dataset.parentSendReply;
        const teacher = DB.users[teacherKey];
        const ta = document.querySelector(`[data-parent-reply="${teacherKey}"]`);
        const body = ta ? ta.value.trim() : '';
        if(!body || !teacher) return;
        const children = parentChildren();
        const selected = children.find(c=>c.username===parentSelectedChild) || children[0];
        if(!selected) return;
        const { error } = await sb.from('messages').insert({ student_username: selected.username, teacher_id: teacher.id, from_id: currentUser.id, from_role:'parent', body });
        if(error){ showGlobalError(error.message); return; }
        notifyTeacherOfMessage(teacherKey, selected.username);
        await refreshAll(); render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  });
  const contactSendBtn = document.getElementById('contactSendBtn');
  if(contactSendBtn){
    contactSendBtn.addEventListener('click', async ()=>{
      try{
        const teacher = DB.users[document.getElementById('contactTeacherSelect').value];
        const body = document.getElementById('contactMessageBody').value.trim();
        if(!teacher || !body) return;
        const children = parentChildren();
        const selected = children.find(c=>c.username===parentSelectedChild) || children[0];
        if(!selected) return;
        const { error } = await sb.from('messages').insert({ student_username: selected.username, teacher_id: teacher.id, from_id: currentUser.id, from_role:'parent', body });
        if(error){ showGlobalError(error.message); return; }
        notifyTeacherOfMessage(teacher.key, selected.username);
        await refreshAll();
        document.getElementById('contactMessageBody').value = '';
        flashMsg = {scope:'account', type:'ok', text:'Message sent to the teacher.'};
        render();
      }catch(err){ showGlobalError(err.message || String(err)); }
    });
  }
}


/* ============== Boot ============== */
(async function boot(){
  try{
    await refreshAll();
    const { data: htExists, error: existsErr } = await sb.rpc('headteacher_exists');
    if(existsErr){
      console.error('headteacher_exists check failed', existsErr);
      showGlobalError('Could not check for an existing Headteacher account: ' + (existsErr.message || JSON.stringify(existsErr)) + '. Make sure you have run the latest SQL addendum in Supabase.');
    }
    if(htExists === false){
      bootDiag.needsSetup = true;
    } else {
      await restoreSession();
    }
    bootDiag.ok = true;
  }catch(err){
    console.error('Boot error:', err);
    bootDiag.ok = false;
    bootDiag.error = err.message || String(err);
  }
  loading = false;
  render();
})();
</script>
</body>
</html>
